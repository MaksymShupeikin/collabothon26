# VPS deploy: joins the shared Caddy network (~/pkpways), which proxies comdirect.vokh.dev -> comdirect-web:3000.
services:
  web:
    build: .
    container_name: comdirect-web
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./.data:/app/.data # progress saves (one JSON file); survives rebuilds
    networks: [db_default] # kept: the shared network Caddy reaches this container on

networks:
  db_default:
    external: true
