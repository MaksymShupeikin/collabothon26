# VPS deploy: joins the shared Caddy network (~/pkpways), which proxies comdirect.vokh.dev -> comdirect-web:3000.
services:
  web:
    build: .
    container_name: comdirect-web
    restart: unless-stopped
    env_file: .env # DATABASE_URL=postgres://comdirect:...@db-postgres-1:5432/comdirect (the shared Postgres on db_default)
    networks: [db_default]

networks:
  db_default:
    external: true
